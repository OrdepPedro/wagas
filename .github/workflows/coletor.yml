name: coletor

# SOB DEMANDA — sem cron, de propósito.
#
# Os créditos da Serper são um SALDO ÚNICO que não renova: 2.500, e cada rodada
# completa custa ~84 (7 alvos x 3 blocos x 2 recortes x 2 páginas). Um cron
# diário esgotaria o saldo em menos de um mês coletando para ninguém — não há
# front-end lendo o banco ainda.
#
# Religar quando houver front-end consumindo o cache: descomente o `schedule`
# abaixo. A cadência que fazia sentido era 1x/dia; mais que isso rende pouco,
# porque a janela é de 7 dias e o mesmo resultado voltaria quase inteiro.
#
# on:
#   schedule:
#     - cron: '0 9 * * *'   # 06h de Brasília
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só imprime as consultas planejadas, sem consumir crédito'
        type: boolean
        default: false
      limite:
        description: 'Máximo de consultas nesta execução (vazio = orçamento normal)'
        type: string
        default: ''
      alvo:
        description: 'Rodar um alvo só, pelo id (ex.: pm-bh)'
        type: string
        default: ''
      paginas:
        description: 'Páginas por consulta (1-10). Vazio = padrão do ambiente'
        type: string
        default: ''

permissions:
  contents: read

# Duas rodadas simultâneas consumiriam o saldo em dobro. A reserva atômica no
# Postgres já protege; isto evita o desperdício antes de começar.
concurrency:
  group: coletor-serper
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # O projeto não tem dependência de runtime: sem npm ci, sem cache.
      # Node 24 executa TypeScript direto (type stripping).
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Coletor quebrado gravando lixo é pior que rodada perdida — e aqui cada
      # rodada perdida também custa crédito que não volta.
      - name: Testes
        run: npm test

      - name: Coletar
        env:
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_CREDITOS_TOTAIS: '2500'
          SERPER_ORCAMENTO_POR_RUN: '150'
          SERPER_PAGINAS: '2'
          LOG_LEVEL: info
          # Entradas do disparo manual entram por env, nunca interpoladas no
          # corpo do script — ${{ }} dentro de `run` é injeção de comando.
          DRY_RUN: ${{ inputs.dry_run }}
          LIMITE: ${{ inputs.limite }}
          ALVO: ${{ inputs.alvo }}
          PAGINAS: ${{ inputs.paginas }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${LIMITE:-}" ]; then args+=("--limite=${LIMITE}"); fi
          if [ -n "${ALVO:-}" ]; then args+=("--alvo=${ALVO}"); fi
          if [ -n "${PAGINAS:-}" ]; then args+=("--paginas=${PAGINAS}"); fi
          node src/collect.ts ${args[@]+"${args[@]}"}
